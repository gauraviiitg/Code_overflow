<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" fill="none" role="img" aria-label="Trade corridor from Jaipur via Mundra to EU gift importers">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a4a56"/>
      <stop offset="100%" stop-color="#12161c"/>
    </linearGradient>
    <linearGradient id="dune" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b04a32" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a8894a" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 H0 V24" stroke="#ebe4d8" stroke-opacity="0.06" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="560" height="420" rx="16" fill="url(#sky)"/>
  <rect width="560" height="420" rx="16" fill="url(#grid)"/>
  <ellipse cx="280" cy="340" rx="260" ry="80" fill="url(#dune)"/>
  <!-- Route arc -->
  <path d="M72 280 Q280 80 488 260" stroke="#a8894a" stroke-width="2" stroke-dasharray="6 8" opacity="0.85"/>
  <path d="M72 280 Q280 80 488 260" stroke="#ebe4d8" stroke-width="1" opacity="0.25"/>
  <!-- Jaipur -->
  <circle cx="72" cy="280" r="10" fill="#b04a32"/>
  <circle cx="72" cy="280" r="18" stroke="#b04a32" stroke-opacity="0.35" stroke-width="1"/>
  <text x="72" y="312" text-anchor="middle" fill="#ebe4d8" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Jaipur</text>
  <!-- Mundra -->
  <circle cx="200" cy="200" r="7" fill="#2a6574"/>
  <text x="200" y="188" text-anchor="middle" fill="#ebe4d8" font-size="10" opacity="0.85">Mundra</text>
  <!-- Western ports -->
  <circle cx="420" cy="220" r="7" fill="#ebe4d8"/>
  <circle cx="488" cy="260" r="9" fill="#ebe4d8"/>
  <text x="454" y="248" text-anchor="middle" fill="#ebe4d8" font-size="10" opacity="0.9">EU - SE / DE / NL</text>
  <text x="488" y="292" text-anchor="middle" fill="#ebe4d8" font-size="9" opacity="0.65">US - later</text>
  <!-- Ship icon -->
  <g transform="translate(248 168)">
    <path d="M0 20 L40 20 L32 8 L8 8 Z" fill="#1a4a56" stroke="#a8894a" stroke-width="1"/>
    <rect x="14" y="0" width="12" height="10" fill="#b04a32" opacity="0.9"/>
  </g>
  <text x="280" y="36" text-anchor="middle" fill="#ebe4d8" font-family="Georgia,serif" font-size="17" font-style="italic" opacity="0.95">Jaipur - Mundra - EU gift importers</text>
</svg>
